      <!-- Section 11: close -->
      <section class="closing">
        <div class="wrap close-layout">
          <div>
            <div class="eyebrow">AMANDE · L'ART DE VIVRE</div>
            <h2 class="serif" data-copy="closingTitle"></h2>
            <p data-copy="closingCopy"></p>
            <a
              class="link store"
              data-location="closing_cta"
              target="_blank"
              rel="noopener noreferrer"
              href="#"
              data-copy="shop"
            ></a>
          </div>
          <div class="close-links">
            <a
              class="link whatsapp"
              target="_blank"
              rel="noopener noreferrer"
              href="#"
              data-copy="whatsapp"
            ></a
            ><a
              class="link instagram"
              target="_blank"
              rel="noopener noreferrer"
              href="https://www.instagram.com/loccitaneamande/"
              data-copy="instagram"
            ></a>
            <a
              class="link tiktok"
              target="_blank"
              rel="noopener noreferrer"
              href="https://www.tiktok.com/@loccitane_amande"
              data-copy="tiktok"
            ></a>
          </div>
        </div>
      </section>
    </main>
    <!-- Section 12: footer and privacy -->
    <footer class="footer">
      <div class="wrap">
        <div class="footer-top">
          <a class="wordmark" href="#top">L'Occitane</a
          ><span data-copy="footer"></span>
        </div>
        <p class="privacy" data-copy="academic"></p>
        <p class="privacy" data-copy="privacy"></p>
      </div>
    </footer>
    <!-- Google Analytics 4 loads only after explicit visit-level analytics opt-in. -->
    <aside class="notice" id="analytics-notice" hidden>
      <strong data-ui="consentTitle"></strong>
      <p class="small" data-ui="consentText"></p>
      <div class="notice-actions">
        <button id="analytics-yes" data-ui="allow"></button
        ><button id="analytics-no" data-ui="decline"></button>
      </div>
    </aside>
    <script>
      document.documentElement.classList.add("js");
      const t = (k) => PRODUCT_FACTS.languages[lang][k] ?? UI[lang][k] ?? k;
      function tracked(location) {
        const u = new URL(PRODUCT_FACTS.productUrl),
          incoming = new URLSearchParams(locationSearch);
        for (const [k, v] of incoming)
          if (
            k !== "lang" &&
            ![
              "utm_source",
              "utm_medium",
              "utm_campaign",
              "utm_content",
            ].includes(k)
          )
            u.searchParams.set(k, v);
        u.searchParams.set("utm_source", "landing_page");
        u.searchParams.set("utm_medium", "website");
        u.searchParams.set("utm_campaign", "almond_oil_pilot");
        u.searchParams.set("utm_content", location);
        return u.href;
      }
      const locationSearch = location.search;
      function render() {
        const d = PRODUCT_FACTS.languages[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.body.lang = lang;
        document
          .querySelectorAll("[data-copy]")
          .forEach((e) => (e.textContent = t(e.dataset.copy)));
        document
          .querySelectorAll("[data-ui]")
          .forEach((e) => (e.textContent = UI[lang][e.dataset.ui]));
        document
          .querySelectorAll("[data-label]")
          .forEach((e) => (e.textContent = UI[lang][e.dataset.label]));
        document
          .querySelectorAll(".nav a")
          .forEach((e, i) => (e.textContent = d.nav[i]));
        document
          .querySelectorAll("[data-lang]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.lang === lang)),
          );
        document.querySelector(".skip").textContent = UI[lang].skip;
        document
          .querySelectorAll("[data-size]")
          .forEach((e) => (e.textContent = PRODUCT_FACTS.size));
        document.querySelector(".facts small").textContent =
          PRODUCT_FACTS.reviews.count +
          (lang === "ar" ? " تقييماً" : " reviews");
        document.querySelector("[data-recommend]").textContent =
          lang === "ar" ? "يوصي به" : "recommend";
        document.querySelector("[data-size-label]").textContent =
          lang === "ar" ? "الحجم" : "size";
        document.querySelector("[data-price]").textContent =
          PRODUCT_FACTS.showPrice
            ? PRODUCT_FACTS.priceAED + " AED"
            : d.priceNow;
        document.querySelector("[data-price-label]").textContent =
          lang === "ar" ? "السعر" : "price";
        document.querySelector("[data-fresh]").textContent =
          lang === "ar" ? "كما في 20 نوفمبر 2026" : "As of 20 Nov 2026";
        document.querySelector(".price").textContent = PRODUCT_FACTS.showPrice
          ? d.priceNote
          : d.priceNow;
        document.querySelector(".inci-text").textContent = PRODUCT_FACTS.inci;
        document.querySelector(".badges").replaceChildren(
          ...d.badges.map((x) => {
            let e = document.createElement("span");
            e.className = "badge";
            e.textContent = x;
            return e;
          }),
        );
        document.querySelector(".bars").replaceChildren(
          ...Object.entries(PRODUCT_FACTS.reviews.distribution).map(
            ([star, count]) => {
              let e = document.createElement("div");
              e.className = "barrow";
              e.innerHTML =
                "<span>" +
                star +
                '★</span><span class="bar"><i style="width:' +
                (count / PRODUCT_FACTS.reviews.count) * 100 +
                '%"></i></span><span>' +
                count +
                "</span>";
              return e;
            },
          ),
        );
        document.querySelector(".services").replaceChildren(
          ...d.service.map((label, i) => {
            let a = document.createElement("a");
            a.className = "service";
            a.href = PRODUCT_FACTS.serviceLinks[i];
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.innerHTML =
              '<span class="service-icon" aria-hidden="true">' +
              ["↗", "✳", "◇", "○", "⌖", "✧"][i] +
              "</span><b>" +
              label +
              "</b>" +
              (i < 2 ? '<span class="small">' + d.terms + "</span>" : "");
            return a;
          }),
        );
        document.querySelector("[data-giftbox]").textContent = d.service[2];
        document
          .querySelectorAll(".store")
          .forEach((a) => (a.href = tracked(a.dataset.location)));
        const wa = "[CAMPAIGN_WHATSAPP_NUMBER]";
        document.querySelector(".whatsapp").href = wa.includes("[")
          ? "https://wa.me/"
          : "https://wa.me/" +
            wa.replace(/\D/g, "") +
            "?text=" +
            encodeURIComponent(
              lang === "ar"
                ? "مرحباً، لدي سؤال عن زيت اللوز Supple Skin Oil."
                : "Hello, I have a question about Almond Supple Skin Oil.",
            );
        document
          .querySelector(".menu")
          .setAttribute(
            "aria-label",
            lang === "ar" ? "فتح القائمة" : "Open menu",
          );
        document.querySelector(
          "#inquiry-form button[type=submit]",
        ).textContent = UI[lang].send;
      }
      function setLang(n) {
        lang = n;
        const u = new URL(location.href);
        if (n === "ar") u.searchParams.set("lang", "ar");
        else u.searchParams.delete("lang");
        history.replaceState({}, "", u);
        render();
        if (consented) event("language_toggle", { language: n });
      }
      document
        .querySelectorAll("[data-lang]")
        .forEach((b) =>
          b.addEventListener("click", () => setLang(b.dataset.lang)),
        );
      const menu = document.querySelector(".menu");
      menu.addEventListener("click", () => {
        let open = menu.getAttribute("aria-expanded") !== "true";
        menu.setAttribute("aria-expanded", String(open));
        document.querySelector(".nav").classList.toggle("open", open);
      });
      document.querySelectorAll(".nav a").forEach((a) =>
        a.addEventListener("click", () => {
          document.querySelector(".nav").classList.remove("open");
          menu.setAttribute("aria-expanded", "false");
        }),
      );
      let consented = false;
      const GA4_MEASUREMENT_ID = "G-B8HB6B5DHZ";
      function event(name, params = {}) {
        if (window.gtag) gtag("event", name, params);
      }
      document
        .querySelectorAll(".store")
        .forEach((a) =>
          a.addEventListener("click", () => {
            event("store_click", { button_location: a.dataset.location });
            event("shop_click", {
              button_name: a.textContent.trim(),
              page_location: window.location.href,
              destination_url: a.href,
            });
          }),
        );
      document
        .querySelector(".whatsapp")
        .addEventListener("click", () => event("whatsapp_click"));
      document
        .querySelector(".instagram")
        .addEventListener("click", () => event("instagram_click"));
      document
        .querySelector(".tiktok")
        .addEventListener("click", () => event("tiktok_click"));
      let notice = document.querySelector("#analytics-notice");
      notice.hidden = false;
      document.querySelector("#analytics-yes").addEventListener("click", () => {
        consented = true;
        notice.hidden = true;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        window.gtag("config", GA4_MEASUREMENT_ID, { send_page_view: true });
        const s = document.createElement("script");
        s.async = true;
        s.src =
          "https://www.googletagmanager.com/gtag/js?id=" +
          encodeURIComponent(GA4_MEASUREMENT_ID);
        document.head.append(s);
      });
      document
        .querySelector("#analytics-no")
        .addEventListener("click", () => (notice.hidden = true));
      const form = document.querySelector("#inquiry-form"),
        status = document.querySelector("#form-status");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!form.reportValidity()) return;
        let fd = new FormData(form),
          button = form.querySelector("[type=submit]");
        button.disabled = true;
        button.textContent = UI[lang].sending;
        status.textContent = "";
        try {
          let r = await fetch("/api/inquiry", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                name: fd.get("name"),
                email: fd.get("email"),
                phone: fd.get("phone"),
                interest: fd.get("interest"),
                marketingConsent: fd.get("marketingConsent") === "true",
                website: fd.get("website"),
              }),
            }),
            body = await r.json().catch(() => ({}));
          if (!r.ok) throw Error(body.message || "error");
          status.textContent = UI[lang].sent;
          event("inquiry_submit", {
            marketing_consent: fd.get("marketingConsent") === "true",
          });
          event("lead_submit", {
            form_name: "customer_inquiry",
            page_location: window.location.href,
            submission_type: "inquiry",
          });
          form.reset();
        } catch {
          status.textContent = UI[lang].error;
        } finally {
          button.disabled = false;
          button.textContent = UI[lang].send;
        }
      });
      const io = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("in");
              io.unobserve(e.target);
            }
          }),
        { threshold: 0.12 },
      );
      document.querySelectorAll(".fade").forEach((e) => io.observe(e));
      render();
    </script>
    <script>
      // Optional [AR_STORE_URL]: no Arabic product URL was verified; the English UAE URL is used as fallback.
      PRODUCT_FACTS.name = {
        en: "Almond (Amande) Supple Skin Oil",
        ar: "زيت اللوز للعناية بالبشرة",
      };
      PRODUCT_FACTS.stockStatus = "purchasable";
      PRODUCT_FACTS.languages.en.heroTitle =
        "Light, fine oil. A softer moment.";
      PRODUCT_FACTS.languages.ar.heroTitle =
        "زيت خفيف وناعم، للحظة عناية أهدأ.";
      if (!PRODUCT_FACTS.inci.endsWith(".")) PRODUCT_FACTS.inci += ".";
      const productLabel = document.createElement("p");
      productLabel.className = "eyebrow product-name";
      document
        .querySelector("h1")
        .insertAdjacentElement("afterend", productLabel);
      function syncProductLabelAndReviews() {
        productLabel.textContent = PRODUCT_FACTS.name[lang];
        document.querySelector("[data-rating]").textContent =
          PRODUCT_FACTS.reviews.score + "/5";
        document.querySelector("[data-recommended]").textContent =
          PRODUCT_FACTS.reviews.recommended + "%";
        const reviewCount = PRODUCT_FACTS.reviews.count;
        document.querySelector("[data-count]").textContent =
          reviewCount + (lang === "ar" ? " تقييماً" : " reviews");
        document.querySelector("[data-review-score]").textContent =
          lang === "ar"
            ? PRODUCT_FACTS.reviews.score + " من 5"
            : PRODUCT_FACTS.reviews.score + " out of 5";
        document.querySelector('[data-copy="reviewCount"]').textContent =
          lang === "ar"
            ? reviewCount +
              " تقييماً · يوصي به " +
              PRODUCT_FACTS.reviews.recommended +
              "%"
            : reviewCount +
              " reviews · " +
              PRODUCT_FACTS.reviews.recommended +
              "% recommended";
        document.querySelector('[data-copy="asOf"]').textContent =
          lang === "ar"
            ? "كما في 20 نوفمبر 2026"
            : "As of " + PRODUCT_FACTS.reviews.asOf;
        document.querySelector("[data-fresh]").textContent =
          lang === "ar"
            ? "كما في 20 نوفمبر 2026"
            : "As of " + PRODUCT_FACTS.reviews.asOf;
      }
      document
        .querySelectorAll("[data-lang]")
        .forEach((b) =>
          b.addEventListener("click", syncProductLabelAndReviews),
        );
      syncProductLabelAndReviews();
      function syncAvailability() {
        document
          .querySelectorAll(
            '.store[data-location="hero_cta"],.store[data-location="closing_cta"]',
          )
          .forEach((a) => {
            a.textContent =
              PRODUCT_FACTS.stockStatus === "purchasable"
                ? PRODUCT_FACTS.languages[lang].shop
                : lang === "ar"
                  ? "عرض المنتج على الموقع الرسمي ↗"
                  : "View on L'Occitane UAE ↗";
          });
      }
      document
        .querySelectorAll("[data-lang]")
        .forEach((b) => b.addEventListener("click", syncAvailability));
      syncAvailability();
      // Replace [CAMPAIGN_WHATSAPP_NUMBER] in the closing-link setup.
      const rtlLayout = document.createElement("style");
      rtlLayout.textContent =
        "body[lang=ar] .hero-art,body[lang=ar] .ritual-image,body[lang=ar] .ritual-image img,body[lang=ar] .hero-bottle{transform:none!important}";
      document.head.append(rtlLayout);
      const staticEnglish = {
        "A DAILY PAUSE": "لحظة عناية يومية",
        "STEP BY STEP": "خطوة بخطوة",
        "01 · EXFOLIATE": "٠١ · تقشير",
        "02 · CLEANSE": "٠٢ · تنظيف",
        "03 · THIS PRODUCT": "٠٣ · هذا المنتج",
        "ORIGIN · FORMULA": "الأصل · التركيبة",
        "A THOUGHTFUL GESTURE": "لفتة تعبّر عن الاهتمام",
        "HERE TO HELP": "نحن هنا للمساعدة",
        "AMANDE · L'ART DE VIVRE": "أماند · فن العيش",
      };
      const staticArabic = {
        "A DAILY PAUSE": "A DAILY PAUSE",
        "STEP BY STEP": "STEP BY STEP",
        "01 · EXFOLIATE": "01 · EXFOLIATE",
        "02 · CLEANSE": "02 · CLEANSE",
        "03 · THIS PRODUCT": "03 · THIS PRODUCT",
        "ORIGIN · FORMULA": "ORIGIN · FORMULA",
        "A THOUGHTFUL GESTURE": "A THOUGHTFUL GESTURE",
        "HERE TO HELP": "HERE TO HELP",
        "AMANDE · L'ART DE VIVRE": "AMANDE · L'ART DE VIVRE",
      };
      function syncStatic() {
        const dict = lang === "ar" ? staticEnglish : staticArabic;
        document.querySelectorAll(".eyebrow,.stepnum").forEach((e) => {
          const en = Object.keys(staticEnglish).find(
            (k) => e.dataset.static === k || e.textContent.trim() === k,
          );
          if (en) e.textContent = lang === "ar" ? staticEnglish[en] : en;
        });
        document.querySelectorAll("img").forEach((img, i) => {
          const en = [
            "L'Occitane Almond Supple Skin Oil bottle",
            "Close-up of L'Occitane Almond Supple Skin Oil",
            "L'Occitane Almond body care range including Supple Skin Oil",
            "L'Occitane Almond Supple Skin Oil bottle, 100 ml",
          ][i];
          const ar = [
            "زجاجة زيت اللوز للعناية بالبشرة من ل'أوكسيتان",
            "لقطة قريبة لزيت اللوز للعناية بالبشرة من ل'أوكسيتان",
            "مجموعة العناية بالجسم باللوز من ل'أوكسيتان، وتتضمن زيت البشرة",
            "زجاجة زيت اللوز للعناية بالبشرة من ل'أوكسيتان، 100 مل",
          ][i];
          if (en) img.alt = lang === "ar" ? ar : en;
        });
        document
          .querySelector(".bars")
          .setAttribute(
            "aria-label",
            lang === "ar" ? "توزيع التقييمات" : "Review distribution",
          );
        document
          .querySelector(".nav")
          .setAttribute(
            "aria-label",
            lang === "ar" ? "التنقل الرئيسي" : "Main navigation",
          );
      }
      document
        .querySelectorAll("[data-lang]")
        .forEach((b) => b.addEventListener("click", syncStatic));
      syncStatic();
      document.querySelectorAll(".eyebrow,.stepnum").forEach((e) => {
        const key = Object.keys(staticEnglish).find(
          (k) => e.textContent.trim() === k,
        );
        if (key) e.dataset.static = key;
      });
      document.querySelectorAll("img[srcset]").forEach((img) =>
        img.addEventListener("error", () => {
          if (img.dataset.fallback) return;
          img.dataset.fallback = "true";
          img.removeAttribute("srcset");
          img.src = img.src.replace(/\.webp(?:\?.*)?$/i, ".jpg");
        }),
      );
      form.addEventListener(
        "invalid",
        (e) => {
          const field = e.target;
          if (!field.matches("input,textarea")) return;
          field.setCustomValidity(
            field.validity.valueMissing
              ? UI[lang].required
              : field.type === "email"
                ? UI[lang].emailError
                : UI[lang].limit,
          );
        },
        true,
      );
      form
        .querySelectorAll("input,textarea")
        .forEach((field) =>
          field.addEventListener("input", () => field.setCustomValidity("")),
        );
      const priceNode = document.querySelector(".price");
      priceNode.setAttribute("role", "link");
      priceNode.tabIndex = 0;
      priceNode.style.textDecoration = "underline";
      function refreshPrice() {
        const d = PRODUCT_FACTS.languages[lang];
        priceNode.textContent = PRODUCT_FACTS.showPrice
          ? PRODUCT_FACTS.priceAED + " AED · " + d.priceNote
          : d.priceNow;
      }
      document
        .querySelectorAll("[data-lang]")
        .forEach((b) => b.addEventListener("click", refreshPrice));
      priceNode.addEventListener("click", () =>
        window.open(tracked("facts_link"), "_blank", "noopener,noreferrer"),
      );
      priceNode.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          priceNode.click();
        }
      });
      refreshPrice();
    </script>
  </body>
</html>
